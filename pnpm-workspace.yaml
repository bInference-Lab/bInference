packages:
  - packages/*
  - plugins/*

# Every version lives here; package.json files write "catalog:".
catalogMode: strict
catalog:
  "@commitlint/cli": 21.2.3
  "@commitlint/types": 21.2.3
  "@modelcontextprotocol/client": 2.2.0
  "@modelcontextprotocol/server": 2.2.0
  "@napi-rs/keyring": 2.1.0
  "@noble/curves": 2.4.0
  "@stryker-mutator/core": 10.0.0
  "@types/node": 26.6.3
  "@types/ws": 8.18.2
  "@vitest/coverage-v8": 5.0.2
  execa: 10.0.1
  fast-check: 4.10.2
  grammy: 1.46.0
  intl-messageformat: 12.1.2
  jscpd: 5.3.3
  json5: 2.2.3
  knip: 6.38.0
  kysely: 0.29.6
  markdownlint-cli2: 0.23.3
  oxfmt: 0.71.0
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  tsdown: 0.23.0
  tsx: 4.23.15
  turbo: 2.11.5
  typescript: 7.0.2
  undici: 8.11.2
  viem: 2.57.1
  vitest: 5.0.2
  which-command: 0.1.0
  ws: 8.22.0
  yaml: 2.9.1
  zod: 4.6.5

# Refuse a Node outside the range in package.json "engines".
engineStrict: true

# A release must be 7 days old before it installs, with no fallback to a newer one.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# Each exclusion states its reason and the day it goes.
minimumReleaseAgeExclude:
  # Security fix for GHSA-68fv-2mgg-jv7q, released 2026-09-30; remove after 2026-10-07.
  - source-map-js@1.2.2

overrides:
  # GHSA-68fv-2mgg-jv7q: source-map-js below 1.2.2 can block the event loop (through postcss).
  source-map-js: 1.2.2

auditConfig:
  ignoreGhsas:
    # Reaches only our own glob patterns through markdownlint-cli2, and no fixed release exists
    # yet; remove after 2026-11-06.
    - GHSA-vfj7-8cjw-p6xm
blockExoticSubdeps: true
nodeLinker: isolated
savePrefix: ""

# Install scripts stay off. Every package with a build script is named here, refused ones too.
strictDepBuilds: true
allowBuilds:
  # Ships prebuilt binaries; its postinstall only checks them.
  esbuild: false
