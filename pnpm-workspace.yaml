packages:
  - packages/*
  - plugins/*

# Every version lives here; package.json files write "catalog:".
catalogMode: strict
catalog:
  "@stryker-mutator/core": 10.0.0
  "@types/node": 26.6.3
  "@vitest/coverage-v8": 5.0.2
  fast-check: 4.10.2
  oxfmt: 0.71.0
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  tsdown: 0.23.0
  tsx: 4.23.15
  turbo: 2.11.5
  typescript: 7.0.2
  undici: 8.11.2
  vitest: 5.0.2
  zod: 4.6.5

# Refuse a Node outside the range in package.json "engines".
engineStrict: true

# A release must be 7 days old before it installs, with no fallback to a newer one.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
nodeLinker: isolated
savePrefix: ""

# Install scripts stay off. Every package with a build script is named here, refused ones too.
strictDepBuilds: true
allowBuilds:
  # Ships prebuilt binaries; its postinstall only checks them.
  esbuild: false
