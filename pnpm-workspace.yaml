  "@astrojs/starlight": 0.42.7
  "@base-ui/react": 1.8.0
  "@clack/prompts": 1.8.1
  "@commitlint/cli": 21.2.3
  "@commitlint/types": 21.2.3
  "@fontsource-variable/hanken-grotesk": 5.3.0
  "@hpke/chacha20poly1305": 1.8.0
  "@hpke/core": 1.9.0
  "@modelcontextprotocol/client": 2.3.0
  "@modelcontextprotocol/server": 2.3.0
  "@napi-rs/keyring": 2.1.0
  "@noble/curves": 2.4.0
  "@playwright/test": 1.63.0
  "@privy-io/node": 0.35.0
  "@sigstore/bundle": 5.0.0
  "@sigstore/protobuf-specs": 0.5.2
  "@sigstore/verify": 4.1.2
  "@solana/kit": 8.5.0
  "@stryker-mutator/core": 10.0.0
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-query": 5.104.1
  "@tanstack/react-router": 1.170.41
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@types/node": 26.6.3
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/ws": 8.18.2
  "@vitejs/plugin-react": 6.1.1
  "@vitest/coverage-v8": 5.0.3
  astro: 7.4.4
  class-variance-authority: 0.7.1
  cn: 0.4.0
  commander: 15.0.0
  execa: 10.0.1
  fake-indexeddb: 6.2.5
  fast-check: 4.10.2
  grammy: 1.46.0
  intl-messageformat: 12.1.2
  jscpd: 5.3.3
  jsdom: 30.1.1
  json5: 2.2.3
  knip: 6.38.0
  kysely: 0.29.6
  lucide-react: 1.51.0
  markdownlint-cli2: 0.23.3
  node-pty: 1.2.0-beta.15
  openai: 7.28.0
  oxfmt: 0.71.0
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  react: 19.3.0
  react-dom: 19.3.0
  string-width: 8.3.0
  tailwindcss: 4.3.3
  tsdown: 0.23.0
  tslog: 5.2.0
  tsx: 4.23.15
  turbo: 2.11.5
  typescript: 7.0.2
  undici: 8.12.2
  viem: 2.57.1
  vite: 8.3.3
  vitest: 5.0.3
  which-command: 0.1.0
  ws: 8.22.0
  yaml: 2.9.1
  zod: 4.6.6

# Refuse a Node outside the range in package.json "engines".
engineStrict: true

# A release must be 7 days old before it installs, with no fallback to a newer one.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

overrides:
  # GHSA-gfr2-rv44-r23c and two more: markdown-it below 15.0.3 takes quadratic time on some
  # input (through markdownlint-cli2, which pins 15.0.1).
  markdown-it: 15.0.3
  # GHSA-r4xh-jqrq-34v2: smol-toml 1.8.0 parses in quadratic time. Only markdownlint-cli2's pinned
  # copy moves, since astro needs ^1.9.1.
  markdownlint-cli2>smol-toml: 1.9.0
  # GHSA-68fv-2mgg-jv7q: source-map-js below 1.2.2 can block the event loop (through postcss).
  source-map-js: 1.2.2
  # GHSA-2m5v-pch6-74hx and seven more: undici below 8.12.2 drops TLS options and can crash on a
  # hostile server. openai, jsdom and astro take the catalog's undici too.
  undici: "catalog:"
  # GHSA-mrhx-c7xc-m3w5: zod below 4.6.6 can run out of memory on an oversized array or record.
  # The MCP SDK, astro and its sitemap take the catalog's zod too.
  zod: "catalog:"

auditConfig:
  ignoreGhsas:
    # Reaches only our own glob patterns through markdownlint-cli2, and no fixed release exists
    # yet; remove after 2026-11-06.
    - GHSA-vfj7-8cjw-p6xm
blockExoticSubdeps: true
nodeLinker: isolated
savePrefix: ""

# Install scripts stay off. Every package with a build script is named here, refused ones too.
strictDepBuilds: true
allowBuilds:
  # Ships prebuilt binaries; its postinstall only checks them.
  esbuild: false
  # Microsoft's pseudo-terminal for the terminal chat test: its install script picks the prebuilt
  # binary for macOS, Linux or Windows, and builds from source only when none fits.
  node-pty: true
