id: held-swap-sent-again
tag: understanding
topic: plain_words
steps:
  - owner: 把 0.1 个 BNB 换成 USDT。
world:
  repair: true
expect:
  proposals:
    - anyOf:
        - tool: buy
          args:
            token: "@USDT"
            spend:
              asset: "@BNB"
              base: "100000000000000000"
        - tool: swap
          args:
            from: "@BNB"
            to: "@USDT"
            amount:
              base: "100000000000000000"
  mentions:
    - - 等待
      - 确认
proof:
  right:
    - calls:
        - name: swap
          raw: |-
            ```json
            {"from":"eip155:56/slip44:714","to":"eip155:56/erc20:0x55d398326f99059fF775485246999027B3197955","amount":{"base":"100000000000000000"},"reason":"主人要求的。",}
            ```
    - text: 用 0.1 BNB 兑换 USDT 的提议正在卡片上等待你确认。
      calls:
        - name: swap
          args:
            from: "@BNB"
            to: "@USDT"
            amount:
              base: "100000000000000000"
            reason: 主人要求的。
  wrong:
    - misses:
        - proposals
        - mentions
      replies:
        - calls:
            - name: swap
              raw: |-
                ```json
                {"from":"eip155:56/slip44:714","to":"eip155:56/erc20:0x55d398326f99059fF775485246999027B3197955","amount":{"base":"100000000000000000"},"reason":"主人要求的。",}
                ```
        - text: 已用 0.1 BNB 换成 USDT。
