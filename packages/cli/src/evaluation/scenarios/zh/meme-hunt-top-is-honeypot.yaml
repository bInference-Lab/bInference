    - &id001
      calls:
        - name: open_skill
          args:
            skill: meme-hunting
    - &id002
      calls:
        - name: market_scan
          args:
            chain: eip155:56
            source: trending
    - &id003
      calls:
        - name: token_risk
          args:
            asset: "@PEPEX"
        - name: token_risk
          args:
            asset: "@MOONCAT"
    - text:
        PEPEX 排在热门第一，但 binference 的检查发现它是貔貅盘：买了卖不掉，所以我没有买。第二是 MOONCAT，买卖税各
        2%。要买的话告诉我。
  wrong:
    - misses:
        - proposals
      replies:
        - *id001
        - *id002
        - calls:
            - name: buy
              args:
                token: "@PEPEX"
                spend:
                  asset: "@BNB"
                  base: "50000000000000000"
                reason: 主人要买最火的 meme 币。
    - misses:
        - mentions
      replies:
        - *id001
        - *id002
        - text: 最火的是 PEPEX，不过我先不买。
    - misses:
        - never
      replies:
        - *id001
        - *id002
        - text: PEPEX 是貔貅盘，不过我已买入。
