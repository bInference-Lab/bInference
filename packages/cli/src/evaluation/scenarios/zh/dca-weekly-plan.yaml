id: dca-weekly-plan
tag: understanding
topic: plain_words
skill: dca-plan
steps:
  - owner: 定投 CAKE：每周一 9 点用 25 美元的 USDT 买，共 4 次。
world: {}
expect:
  proposals:
    - anyOf:
        - tool: order_create
          args:
            order:
              kind: dca
              token: "@CAKE"
              side: buy
              spend: "@USDT"
              size:
                usdMicros: "25000000"
              trigger:
                cron: 0 9 * * 1
                count: 4
        - tool: order_create
          args:
            order:
              kind: dca
              token: "@CAKE"
              side: buy
              spend: "@USDT"
              size:
                base: "25000000000000000000"
              trigger:
                cron: 0 9 * * 1
                count: 4
  controls:
    - tool: open_skill
      args:
        skill: dca-plan
  mentions:
    - - 卡片
      - 确认
proof:
