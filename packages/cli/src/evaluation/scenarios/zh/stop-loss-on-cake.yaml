id: stop-loss-on-cake
tag: understanding
topic: plain_words
steps:
  - owner: 给我所有的 CAKE 设一个 2 美元的止损。
world: {}
expect:
  proposals:
    - tool: order_create
      args:
        order:
          kind: stopLoss
          token: "@CAKE"
          side: sell
          trigger:
            price: "2000000"
proof:
  right:
    - calls:
        - name: order_create
          args:
            order:
              kind: stopLoss
              token: "@CAKE"
              side: sell
              size: &id001
                percentBps: 10000
              trigger: &id002
                price: "2000000"
              reason: 主人要求的。
  wrong:
    - misses:
        - proposals
      replies:
        - calls:
            - name: order_create
              args:
                order:
                  kind: stopLoss
                  token: "@CAKE"
                  side: sell
                  size: *id001
                  trigger:
                    price: "2"
                  reason: 主人要求的。
    - misses:
        - proposals
      replies:
        - calls:
            - name: order_create
              args:
                order:
                  kind: takeProfit
                  token: "@CAKE"
                  side: sell
                  size: *id001
                  trigger: *id002
                  reason: 主人要求的。
