id: quote-without-trading
tag: understanding
topic: plain_words
steps:
  - owner: How much USDT would 0.5 BNB get me right now? Don't trade yet.
world: {}
expect:
  proposals: []
  mentions:
    - - "300"
      - "298"
proof:
  right:
    - calls:
        - name: quote
          args: &id001
            from: "@BNB"
            to: "@USDT"
            amount:
              base: "500000000000000000"
            reason: The owner asked for it.
    - text: About 300 USDT, and at least 298.5 USDT after slippage.
  wrong:
    - misses:
        - proposals
      replies:
        - calls:
            - name: quote
              args: *id001
        - calls:
            - name: swap
              args:
                from: "@BNB"
                to: "@USDT"
                amount:
                  base: "500000000000000000"
                reason: The owner asked for it.
    - misses:
        - mentions
      replies:
        - calls:
            - name: quote
              args: *id001
        - text: About 250 USDT.
