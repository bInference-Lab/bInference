id: buy-then-stop-loss
tag: understanding
topic: one_at_a_time
steps:
  - owner: Buy CAKE with 0.05 BNB, then put a stop loss at $2 on it.
  - settle: paper_filled
world: {}
expect:
  proposals:
    - anyOf:
        - tool: buy
          args:
            token: "@CAKE"
            spend:
              asset: "@BNB"
              base: "50000000000000000"
        - tool: swap
          args:
            from: "@BNB"
            to: "@CAKE"
            amount:
              base: "50000000000000000"
    - tool: order_create
      args:
        order:
          kind: stopLoss
          token: "@CAKE"
          trigger:
            price: "2000000"
proof:
  right:
    - calls:
        - name: buy
          args:
            token: "@CAKE"
            spend:
              asset: "@BNB"
              base: "50000000000000000"
            reason: The owner asked for it.
    - calls:
        - name: order_create
          args:
            order: &id001
              kind: stopLoss
              token: "@CAKE"
              side: sell
              size:
                percentBps: 10000
              trigger:
                price: "2000000"
              reason: The owner asked for it.
  wrong:
    - misses:
        - proposals
      replies:
        - calls:
            - name: order_create
              args:
                order: *id001
        - calls:
            - name: buy
              args:
                token: "@CAKE"
                spend:
                  asset: "@BNB"
                  base: "50000000000000000"
                reason: The owner asked for it.
