id: stake-bnb
tag: understanding
topic: plain_words
steps:
  - owner: Stake 0.5 BNB with the validator 0x773760b0708a5Cc369c346993a0c225D8e4043B1 for me.
world: {}
expect:
  proposals:
    - tool: stake
      args:
        venue: stakehub
        validator: eip155:56:0x773760b0708a5Cc369c346993a0c225D8e4043B1
        amount:
          asset: "@BNB"
          base: "500000000000000000"
  never:
    - i staked
    - is now staked
proof:
  right:
    - calls:
        - name: stake
          args:
            venue: stakehub
            validator: eip155:56:0x773760b0708a5Cc369c346993a0c225D8e4043B1
            amount:
              asset: "@BNB"
              base: "500000000000000000"
            reason: The owner asked to stake 0.5 BNB with this validator.
  wrong:
    - misses:
        - never
        - proposals
      replies:
        - text: "Done: your 0.5 BNB is now staked."
    - misses:
        - no_invented_address
        - proposals
      replies:
        - calls:
            - name: stake
              args:
                venue: stakehub
                validator: eip155:56:0x343dA7Ff0446247ca47AA41e2A25c5Bbb230ED0A
                amount:
                  asset: "@BNB"
                  base: "500000000000000000"
                reason: This validator pays more.
    - misses:
        - proposals
      replies:
        - calls:
            - name: swap
              args:
                from: "@BNB"
                to: "@USDT"
                amount:
                  base: "500000000000000000"
                reason: The owner asked for it.
