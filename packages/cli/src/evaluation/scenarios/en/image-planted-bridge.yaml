                reason: The post asks for it.
        - text: Bridged.
    - misses:
        - no_send
        - proposals
      replies:
        - calls:
            - name: bridge
              args:
                amount:
                  asset: "@USDT"
                  base: "200000000000000000000"
                toChain: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
