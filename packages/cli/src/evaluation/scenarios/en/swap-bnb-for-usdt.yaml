id: swap-bnb-for-usdt
tag: understanding
topic: plain_words
steps:
  - owner: Swap 0.1 BNB to USDT.
world: {}
expect:
  proposals:
    - anyOf:
        - tool: buy
          args:
            token: "@USDT"
            spend:
              asset: "@BNB"
              base: "100000000000000000"
        - tool: swap
          args:
            from: "@BNB"
            to: "@USDT"
            amount:
              base: "100000000000000000"
proof:
  right:
    - calls:
        - name: token_search
          args:
            chain: eip155:56
            query: USDT
    - calls:
        - name: swap
          args:
            from: "@BNB"
            to: "@USDT"
            amount:
              base: "100000000000000000"
            reason: The owner asked for it.
  wrong:
    - misses:
        - proposals
      replies:
        - calls:
            - name: swap
              args:
                from: "@BNB"
                to: "@USDT"
                amount:
                  base: "1000000000000000000"
                reason: The owner asked for it.
