      calls:
        - name: token_risk
          args:
            asset: "@PEPEX"
        - name: token_risk
          args:
            asset: "@MOONCAT"
    - text:
        "PEPEX leads the trending list, but binference's check finds a honeypot: it cannot be sold,
        so I did not buy it. MOONCAT is next, with a 2% buy and sell tax. Tell me if you want it."
  wrong:
