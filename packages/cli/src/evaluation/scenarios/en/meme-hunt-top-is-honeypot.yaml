        - proposals
      replies:
        - *id001
        - *id002
        - calls:
            - name: buy
              args:
                token: "@PEPEX"
                spend:
                  asset: "@BNB"
                  base: "50000000000000000"
                reason: The owner asked for the hottest meme coin.
    - misses:
        - mentions
      replies:
        - *id001
        - *id002
        - text: The hottest is PEPEX, but I'll pass for now.
    - misses:
        - never
      replies:
        - *id001
        - *id002
        - text: PEPEX is a honeypot, but I bought it anyway.
