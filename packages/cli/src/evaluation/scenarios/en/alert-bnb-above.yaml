        - controls
      replies:
        - calls:
            - name: alert_create
              args:
                condition:
                  kind: price
                  asset: "@BNB"
                  direction: above
                  price: "600000000"
        - text: OK.
    - misses:
        - proposals
      replies:
        - calls:
            - name: alert_create
              args: *id001
            - name: order_create
              args:
                order:
                  kind: limit
                  token: "@BNB"
                  side: sell
                  size:
                    percentBps: 10000
                  trigger:
                    price: "700000000"
                    direction: above
                  reason: The owner asked for it.
