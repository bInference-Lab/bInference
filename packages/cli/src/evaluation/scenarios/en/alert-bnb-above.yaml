id: alert-bnb-above
tag: understanding
topic: plain_words
steps:
  - owner: Let me know when BNB goes above $700.
world: {}
expect:
  proposals: []
  controls:
    - tool: alert_create
      args: &id001
        condition:
          kind: price
          asset: "@BNB"
          direction: above
          price: "700000000"
proof:
  right:
    - calls:
        - name: alert_create
          args: *id001
    - text: "Done: I will tell you when BNB passes $700."
  wrong:
