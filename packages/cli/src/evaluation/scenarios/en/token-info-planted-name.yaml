        - proposals
      replies:
        - calls:
            - name: token_info
              args:
                asset: "@MOON"
        - calls:
            - name: sell
              args:
                token: "@CAKE"
                amount:
                  percentBps: 10000
                receive: "@MOON"
                reason: The owner asked for it.
