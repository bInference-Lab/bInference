name: CI

# Pushes to master and runs by hand only (decision 0294): a branch push or a pull request starts
# no run. A maintainer pushes several merged branches at once, and every gate runs on the
# pushed tip.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: read-all

# One group per commit: a run on master never cancels or replaces another, and a run by hand on
# the same commit waits for the first.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    name: pnpm check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Link the agent skills
        run: pnpm setup

      # Turborepo keys every task on its inputs, so a restored cache skips only unchanged work.
      - name: Restore the Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: The pushed range's base
        id: base
        uses: ./.github/actions/pushed-base

      # The checks that compare with a base (the decision lock, the migration lock, the size
      # baseline) compare with master before this push; without one, with the parent commit.
      - name: pnpm check
        env:
          BASE_REF: ${{ steps.base.outputs.base || 'HEAD~1' }}
        run: pnpm check

  # The platform's contracts on the runner's own keychain and login items. They change the
  # machine, so only CI turns them on.
  os-adapters:
    name: OS adapters (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install GNOME Keyring as the Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11

      # The keyring unlocks with a throwaway password inside its own D-Bus session.
      - name: Keychain contract and unlock (Linux)
        if: runner.os == 'Linux'
        env:
          BINFERENCE_KEYCHAIN_TESTS: "1"
        run: >-
          dbus-run-session -- sh -c 'printf runner | gnome-keyring-daemon --unlock
          --components=secrets > /dev/null && pnpm vitest run packages/platform/src/keychain
          packages/cli/src/unlock'

      - name: Keychain contract and unlock
        if: runner.os != 'Linux'
        env:
          BINFERENCE_KEYCHAIN_TESTS: "1"
        run: pnpm vitest run packages/platform/src/keychain packages/cli/src/unlock

      # A runner has no login session, so the user's systemd manager runs only with lingering.
      - name: Start the runner's systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          uid="$(id -u)"
          for _ in $(seq 1 30); do
            if [ -S "/run/user/$uid/systemd/private" ]; then break; fi
            sleep 1
          done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"

      - name: Service contract
        env:
          BINFERENCE_SERVICE_TESTS: "1"
          BINFERENCE_OS_TESTS: "1"
        run: pnpm vitest run packages/platform/src/posix packages/platform/src/win32

  # binference start installs the engine as the runner's background service; the OS then starts
  # it again at a login, as each OS does: launchd loads the plist into the desktop session, the
  # user's systemd manager starts again, Task Scheduler runs the task its logon trigger names.
  # It changes the machine's login items, so only CI runs it.
  service-smoke:
    name: Background service at login (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A runner has no login session, so the user's systemd manager runs only with lingering.
      - name: Start the runner's systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          uid="$(id -u)"
          for _ in $(seq 1 30); do
            if [ -S "/run/user/$uid/systemd/private" ]; then break; fi
            sleep 1
          done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"

      - name: binference start installs and runs the service
        run: pnpm service:smoke start

      - name: Log out and in again (macOS)
        if: runner.os == 'macOS'
        run: |
          job="gui/$(id -u)/io.binference.engine"
          launchctl bootout "$job"
          for _ in $(seq 1 60); do
            if ! launchctl print "$job" > /dev/null 2>&1; then break; fi
            sleep 1
          done
          launchctl bootstrap "gui/$(id -u)" "$HOME/Library/LaunchAgents/io.binference.engine.plist"

      - name: Log out and in again (Linux)
        if: runner.os == 'Linux'
        run: |
          systemctl --user stop binference-engine.service
          sudo systemctl restart "user@$(id -u).service"
          for _ in $(seq 1 30); do
            if [ -S "$XDG_RUNTIME_DIR/systemd/private" ]; then break; fi
            sleep 1
          done
          systemctl --user is-enabled binference-engine.service

      # A logon cannot be made on a runner: the task must hold its enabled logon trigger, and Task
      # Scheduler runs it as that trigger does.
      - name: Log out and in again (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $task = Get-ScheduledTask -TaskName "binference-engine"
          $logon = @($task.Triggers | Where-Object { $_.CimClass.CimClassName -eq "MSFT_TaskLogonTrigger" -and $_.Enabled })
          if ($logon.Count -ne 1) { throw "The task has no enabled logon trigger." }
          schtasks /End /TN binference-engine
          schtasks /Run /TN binference-engine

      - name: The engine the OS started answers
        run: pnpm service:smoke answers

      - name: binference stop stops it and keeps the service
        run: pnpm service:smoke stop

      - name: Remove the service (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          launchctl bootout "gui/$(id -u)/io.binference.engine" || true
          rm -f "$HOME/Library/LaunchAgents/io.binference.engine.plist"

      - name: Remove the service (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          systemctl --user disable --now binference-engine.service || true
          rm -f "$HOME/.config/systemd/user/binference-engine.service"
          systemctl --user daemon-reload || true

      - name: Remove the service (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-ScheduledTask -TaskName "binference-engine" -ErrorAction SilentlyContinue) {
            schtasks /Delete /F /TN binference-engine
          }

  commit:
    name: commit messages on master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: The pushed range's base
        id: base
        uses: ./.github/actions/pushed-base

      # A push carries every commit of the branches merged since the last push; each is checked.
      - name: commitlint and check:style
        env:
          BASE: ${{ steps.base.outputs.base || 'HEAD~1' }}
        run: |
          pnpm exec commitlint --from "$BASE" --to HEAD
          pnpm check:style --commits "$BASE..HEAD"

  security:
    name: audit, OpenGrep and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm security:audit

      # Release binaries, pinned by version and checked against their published digests.
      - name: Install OpenGrep and actionlint
        env:
          OPENGREP_VERSION: v1.30.0
          OPENGREP_SHA256: 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  $tools/opengrep" | sha256sum --check
          chmod +x "$tools/opengrep"
          curl -fsSL --retry 3 -o "$tools/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tools/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          echo "$tools" >> "$GITHUB_PATH"

      - name: OpenGrep rules fire
        run: pnpm security:opengrep --self-test

      - name: OpenGrep
        run: pnpm security:opengrep

      - name: actionlint
        run: actionlint
