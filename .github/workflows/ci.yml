name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    name: pnpm check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Link the agent skills
        run: pnpm setup

      # Turborepo keys every task on its inputs, so a restored cache skips only unchanged work.
      - name: Restore the Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: pnpm check
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/master' }}
        run: pnpm check

  # The platform's contracts on the runner's own keychain and login items. They change the
  # machine, so only CI turns them on.
  os-adapters:
    name: OS adapters (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install GNOME Keyring as the Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11

      # The keyring unlocks with a throwaway password inside its own D-Bus session.
      - name: Keychain contract and unlock (Linux)
        if: runner.os == 'Linux'
        env:
          BINFERENCE_KEYCHAIN_TESTS: "1"
        run: >-
          dbus-run-session -- sh -c 'printf runner | gnome-keyring-daemon --unlock
          --components=secrets > /dev/null && pnpm vitest run packages/platform/src/keychain
          packages/cli/src/unlock'

      - name: Keychain contract and unlock
        if: runner.os != 'Linux'
        env:
          BINFERENCE_KEYCHAIN_TESTS: "1"
        run: pnpm vitest run packages/platform/src/keychain packages/cli/src/unlock

      # A runner has no login session, so the user's systemd manager runs only with lingering.
      - name: Start the runner's systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          uid="$(id -u)"
          for _ in $(seq 1 30); do
            if [ -S "/run/user/$uid/systemd/private" ]; then break; fi
            sleep 1
          done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"

      - name: Service contract
        env:
          BINFERENCE_SERVICE_TESTS: "1"
          BINFERENCE_OS_TESTS: "1"
        run: pnpm vitest run packages/platform/src/posix packages/platform/src/win32

  pull-request:
    name: check:pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: check:pr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm check:pr

  commit:
    name: commit message on master
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Squash merges put one commit on master per pull request.
      - name: commitlint and check:style
        run: |
          pnpm exec commitlint --last
          pnpm check:style --commits HEAD~1..HEAD

  security:
    name: audit, OpenGrep and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm security:audit

      # Release binaries, pinned by version and checked against their published digests.
      - name: Install OpenGrep and actionlint
        env:
          OPENGREP_VERSION: v1.30.0
          OPENGREP_SHA256: 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  $tools/opengrep" | sha256sum --check
          chmod +x "$tools/opengrep"
          curl -fsSL --retry 3 -o "$tools/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tools/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          echo "$tools" >> "$GITHUB_PATH"

      - name: OpenGrep rules fire
        run: pnpm security:opengrep --self-test

      - name: OpenGrep
        run: pnpm security:opengrep

      - name: actionlint
        run: actionlint
