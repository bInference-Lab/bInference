name: Release

# A release from its tag (decision 0353). A pushed tag runs it dry: the build, the packed npm
# tarballs with their checksums, SBOM and notes, and the smoke job on macOS (decisions 0354 and
# 0449), with nothing published and every artifact kept on the run. The release supports macOS
# only, so it builds no image until Linux returns (decision 0449). Publishing runs only by hand,
# with `publish` on, from a tag signed by a key in .github/release-signers that master holds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, such as v2026.11.0-beta.1.
        required: true
        type: string
      publish:
        description: Publish to npm and the GitHub release. Off is a dry run.
        type: boolean
        default: false
      scratch:
        description: A test run. npm gets the dist-tag scratch, and the GitHub release stays a draft.
        type: boolean
        default: false

permissions:
  contents: read

# One run per tag at a time; a release run is never cancelled halfway.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PUBLISH: ${{ inputs.publish == true }}
  SCRATCH: ${{ inputs.scratch == true }}
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  # The same command a maintainer runs before tagging: pnpm release:dry <tag>. No cache: a
  # release builds from the lockfile alone.
  prepare:
    name: Build, pack and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      # Only a tag a release key signed, on master's history, publishes.
      - name: Check the tag's signature and branch
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          if ! grep -qv '^\s*\(#\|$\)' .github/release-signers; then
            echo "::error::.github/release-signers holds no key; add the release key before publishing."
            exit 1
          fi
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/release-signers \
            tag --verify "$TAG"
          git merge-base --is-ancestor "refs/tags/$TAG" refs/remotes/origin/master

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # The install scripts the dry run stages for hosting pin Node by Node's signed sums
      # (decision 0357); gpgv comes with the runner's GnuPG.
      - name: Node pins
        run: pnpm node:pins

      - name: Dry run
        run: pnpm release:dry "$TAG"

      - name: Version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            cat "reports/release/$VERSION/notes.md"
            echo
            echo '```text'
            cat "reports/release/$VERSION/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            reports/release/${{ steps.version.outputs.version }}
            !reports/release/${{ steps.version.outputs.version }}/stage
          if-no-files-found: error
          retention-days: 30

  # The built-package smoke test (decision 0354) on the tarballs the publish job gets, on macOS,
  # the one OS the release supports (decision 0449): they install into an empty project, then the
  # installed binference sets up, starts, trades on paper by chat with the e2e fakes and stops. npm
  # publishes only when it passes. Linux and Windows rows come back with their OS.
  smoke:
    name: Packed install (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Get the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: release-files

      - name: Smoke
        run: |
          set -euo pipefail
          # macOS has shasum where Linux and Git Bash have sha256sum.
          if command -v sha256sum > /dev/null; then sums=(sha256sum); else sums=(shasum -a 256); fi
          (cd release-files && "${sums[@]}" --check SHA256SUMS)
          pnpm release:smoke release-files

  npm:
    name: Publish to npm
    needs: [prepare, smoke]
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The owner approves each publish here; npm's trusted publisher names this workflow and
    # environment.
    environment: release
    # The OIDC token npm's trusted publishing exchanges for a one-time publish, and which signs
    # each package's provenance. A package npm never held publishes once with the environment's
    # bootstrap token instead (decision 0451).
    permissions:
      contents: read
      id-token: write
    steps:
      # The publish check alone: this job installs nothing.
      - name: Check out the publish check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
          sparse-checkout: scripts/release-publish-check.mts
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          package-manager-cache: false

      - name: Get the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: release-files

      # Only a stable or beta release from its tag publishes, never a nightly pack (decision
      # 0354); a refusal here stops the GitHub release too.
      - name: Check the release may publish
        run: node scripts/release-publish-check.mts release-files

      # The same bytes the dry run packed and summed. A version npm already holds is left as it
      # is, so a run that stopped halfway can run again. A package npm holds publishes through
      # trusted publishing alone; a package npm never held publishes once with the bootstrap
      # token, which only that publish reads, through a user config of its own (decision 0451).
      - name: Publish
        working-directory: release-files
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          dist_tag="$(jq -r .npmTag release.json)"
          if [ "$SCRATCH" = "true" ]; then dist_tag=scratch; fi
          # The file names the token's variable, never its value.
          bootstrap_config="$RUNNER_TEMP/bootstrap.npmrc"
          printf '%s\n' "//registry.npmjs.org/:_authToken=\${NPM_BOOTSTRAP_TOKEN}" > "$bootstrap_config"
          jq -r '.packages[] | "\(.name) \(.file)"' release.json | while read -r name file; do
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is on npm already."
              continue
            fi
            if answer="$(npm view "$name" name --json --loglevel=silent)"; then
              npm publish "./$file" --access public --provenance --tag "$dist_tag"
              continue
            fi
            code="$(jq -r '.error.code? // empty' <<< "$answer" 2> /dev/null || true)"
            if [ "$code" != "E404" ]; then
              echo "::error::npm could not be read for $name (${code:-no answer}), so its route is unknown: trusted publishing or a first publish. Run this workflow again once npm answers."
              exit 1
            fi
            if [ -z "$NPM_BOOTSTRAP_TOKEN" ]; then
              echo "::error::$name is not on npm yet, and its first publish needs the secret NPM_BOOTSTRAP_TOKEN, which the release environment lacks. Add an npm token that may publish $name as that secret, then run this workflow again (decision 0451)."
              exit 1
            fi
            echo "$name is new on npm: it publishes once with the bootstrap token (decision 0451)."
            npm publish "./$file" --access public --provenance --tag "$dist_tag" \
              --userconfig "$bootstrap_config"
          done

  github-release:
    name: GitHub release
    needs: [prepare, npm]
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Creating the release and attaching its files.
    permissions:
      contents: write
    steps:
      - name: Get the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: release-files

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$(jq -r .channel release-files/release.json)" = "beta" ]; then flags+=(--prerelease); fi
          if [ "$SCRATCH" = "true" ]; then flags+=(--draft); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "binference $VERSION" --notes-file release-files/notes.md "${flags[@]}" \
            release-files/*.tgz release-files/SHA256SUMS release-files/*.cdx.json
