name: Packed install

# The built-package smoke test from master, every night and on demand (decision 0354): the four
# npm packages packed once by pnpm release:dry --pack-only at a nightly version nothing publishes,
# then installed from their tarballs into an empty project on Linux, macOS and Windows, where the
# installed binference sets up with init --yes, starts, makes a paper trade by chat on the
# synthetic Bot API with a scripted model, and stops. Nothing is published and no job holds a key;
# quotes come from BNB Smart Chain's public RPCs and KyberSwap's API.
on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packed-install
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  # A nightly pack at YYYY.M.0-nightly.<run>: no tag, notes or publish dry run, and every
  # published manifest private, so no publish path takes it.
  pack:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Version
        id: tag
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="$(date -u +%Y.%-m).0-nightly.${RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Pack
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: pnpm release:dry --pack-only "${VERSION}"

      - name: Keep the packed files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-${{ steps.tag.outputs.version }}
          path: |
            reports/release/${{ steps.tag.outputs.version }}
            !reports/release/${{ steps.tag.outputs.version }}/stage
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Packed install (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.os }}
    # About a minute of smoke after the install; the limit holds a slow pnpm install on Windows.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Get the packed files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-${{ needs.pack.outputs.version }}
          path: packed-files

      - name: Smoke
        run: pnpm release:smoke packed-files
