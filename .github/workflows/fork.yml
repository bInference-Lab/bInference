name: Fork suite

# The fork tests against an anvil fork of BSC near the head, every night and on demand. They read
# public nodes only, so the job holds no key; anvil runs on Linux alone here.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: fork-suite
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  fork:
    name: BSC fork suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Foundry's release, pinned by version and checked against its published digest. The suite
      # needs anvil alone.
      - name: Install anvil
        env:
          FOUNDRY_VERSION: v1.7.1
          FOUNDRY_SHA256: cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/foundry"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/foundry.tar.gz" \
            "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          echo "${FOUNDRY_SHA256}  $tools/foundry.tar.gz" | sha256sum --check
          tar -xzf "$tools/foundry.tar.gz" -C "$tools" anvil
          "$tools/anvil" --version
          echo "$tools" >> "$GITHUB_PATH"

      # Vitest writes the results to the job summary.
      - name: Fork suite
        run: pnpm test:fork
