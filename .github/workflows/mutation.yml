name: Mutation

# The packages here are the rows that config/package-graph.json marks for mutation testing.
on:
  pull_request:
    paths:
      - packages/engine/**
      - packages/signer/**
      - stryker.config.mjs

permissions: read-all

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  stryker:
    name: Stryker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Stryker
        run: pnpm mutation

      - name: Summary
        if: always()
        run: pnpm mutation:summary >> "$GITHUB_STEP_SUMMARY"
