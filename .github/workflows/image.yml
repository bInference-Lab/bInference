name: Image suite

# The Docker image built from master and run end to end, every night and on demand: its user,
# health check and volume, setup without prompts, a paper trade and `docker stop`
# (decision 0293). Linux amd64 only; the job holds no key.
on:
  schedule:
    - cron: "13 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-suite
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Builds the image and its build stage, runs them, and removes what it made.
      - name: Image suite
        run: pnpm test:image
